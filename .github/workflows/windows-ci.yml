name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build and test Aurore
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload build and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurore-windows-${{ matrix.configuration }}-x64
          path: |
            x64/${{ matrix.configuration }}/
            test-results/
          if-no-files-found: warn
          retention-days: 14
