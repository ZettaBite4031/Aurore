name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Debug x64
            os: windows-2025-vs2026
            preset: windows-debug

          - name: Windows Release x64
            os: windows-2025-vs2026
            preset: windows-release

          - name: Linux Debug x86-64
            os: ubuntu-24.04
            preset: linux-debug

          - name: Linux Release x86-64
            os: ubuntu-24.04
            preset: linux-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurore-${{ matrix.preset }}
          path: out/build/${{ matrix.preset }}/
          if-no-files-found: warn
          retention-days: 7
